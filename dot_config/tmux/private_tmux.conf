# ═══════════════════════════════════════════════════════════════
# Core Settings
# ═══════════════════════════════════════════════════════════════

set -g mouse on
set-option -g allow-passthrough on
set -g prefix F12
bind F12 send-prefix
unbind C-b

set -g focus-events on
set -s escape-time 0
set -g repeat-time 100
set -g history-limit 999999
set -g extended-keys on

# ═══════════════════════════════════════════════════════════════
# Terminal Features
# ═══════════════════════════════════════════════════════════════

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set-option -sa terminal-features ',xterm-256color:RGB'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ═══════════════════════════════════════════════════════════════
# Windows & Panes
# ═══════════════════════════════════════════════════════════════

set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=colour250'

# ═══════════════════════════════════════════════════════════════
# Key Bindings
# ═══════════════════════════════════════════════════════════════

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind ^ last-window
bind -r n next-window
bind -r p previous-window

bind D run "tmux neww -c ~/.config"
bind H run "tmux neww -c ~"
bind L run "tmux neww -c ~/Downloads"
bind K run "tmux neww -c ~/code/knowledge"

bind G neww -n "git" -S lazygit
bind Y neww -n "yazi" -S yazi
bind f run "tmux neww 'cd ~ && fzf-tmux-sessions'"

bind x kill-window
bind X kill-pane

# ═══════════════════════════════════════════════════════════════
# Copy Mode (Vi)
# ═══════════════════════════════════════════════════════════════

setw -g mode-keys vi
bind-key y copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# ═══════════════════════════════════════════════════════════════
# Status Bar
# ═══════════════════════════════════════════════════════════════

set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'bg=default'

set -g status-left "#[fg=colour250]#S#[default] "
set -g status-left-length 50
set -g status-right ""
set -g status-right-length 0

set -g window-status-separator ""
set -g window-status-format "#[fg=colour240]#[default] #I:#W#{?window_flags,#{window_flags},} #[fg=colour240]#[default]"
set -g window-status-current-format "#[fg=colour252]#[default] #I:#W#{?window_flags,#{window_flags},} #[fg=colour252]#[default]"

set -g window-status-current-style "fg=colour255,bg=default,bold"
set -g status-interval 5

# ═══════════════════════════════════════════════════════════════
# Debug
# ═══════════════════════════════════════════════════════════════

set -g remain-on-exit "off"
bind E show-environment -g
